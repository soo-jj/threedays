<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작심삼일</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--ink:#26302a;--sub:#7a857d;--line:#e3e7df;--accent:#4f9a6a;--accent-ink:#fff;--soil:#b08a64;--leaf:#6fb383;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c19;--card:#212823;--ink:#e8eee9;--sub:#8f9b93;--line:#2f3832;--accent:#6fbd88;--accent-ink:#12261a;--soil:#8a6b4b;--leaf:#5aa371;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c19;--card:#212823;--ink:#e8eee9;--sub:#8f9b93;--line:#2f3832;--accent:#6fbd88;--accent-ink:#12261a;--soil:#8a6b4b;--leaf:#5aa371;color-scheme:dark}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
#app{max-width:480px;margin:0 auto;padding:20px 18px 96px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:15px;margin:26px 0 10px;color:var(--sub);font-weight:600}
.sub{color:var(--sub);font-size:14px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.card .info{flex:1;min-width:0}
.name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--sub);margin-top:2px}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--c)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ghost{background:transparent;color:var(--sub);padding:6px 8px;font-weight:500;font-size:13px}
button.soft{background:var(--line);color:var(--ink)}
button:disabled{background:var(--line);color:var(--sub);cursor:default}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--line);color:var(--sub)}
.tag.ok{background:var(--accent);color:var(--accent-ink)}
.add{display:flex;gap:8px;margin-top:6px}
input,select{font:inherit;flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.empty{color:var(--sub);font-size:14px;padding:18px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;font-size:16px}
nav button.on{color:var(--accent)}
.garden{background:linear-gradient(var(--card),var(--card));border:1px solid var(--line);border-radius:16px;padding:10px 8px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:10px}
.garden svg{width:100%;height:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.md{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:340px}
.md h3{margin:0 0 6px;font-size:18px}
.md p{margin:0 0 16px;color:var(--sub);font-size:14px;line-height:1.5}
.md .bt{display:flex;flex-direction:column;gap:8px}
.drops{position:absolute;left:12px;top:-4px;width:64px;height:100%;pointer-events:none}
.drops i{position:absolute;top:0;width:5px;height:9px;border-radius:50%;background:#6fb7e8;animation:fall .8s ease-in forwards;opacity:0}
@keyframes fall{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(54px);opacity:0}}
.grow{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.drops i,.grow{animation:none}}
.ob{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.ob p{line-height:1.6;margin:0}
.ob ul{padding-left:18px;line-height:1.9;margin:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.gear{background:none;color:var(--sub);padding:8px;margin:0 -8px 0 0;border-radius:50%;line-height:0}
.soil{position:relative;height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:300px;max-height:560px;margin-top:14px;border-radius:16px;overflow:hidden;background:radial-gradient(rgba(80,48,24,.16) 1.2px,transparent 1.8px) 0 0/22px 22px,radial-gradient(rgba(255,235,210,.14) 1px,transparent 1.6px) 11px 11px/22px 22px,linear-gradient(#a87850,#bb8c64)}
.dr{width:13px;height:16px;vertical-align:-2px;margin-right:2px}
.fl{position:absolute;width:8%;transform:translate(-50%,-100%)}
.top .ghost{margin:4px -8px 0 0}
.dds{position:relative;flex:1}
.dds .ddb{display:block;position:relative;width:100%;text-align:left;padding:12px 40px 12px 12px;font:inherit;font-weight:400;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.dds .ch{position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;pointer-events:none}
.dds .ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px 0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.1);z-index:5}
.dds .ddl[hidden]{display:none}
.dds .ddl li{padding:12px;cursor:pointer}
.dds .ddl li[aria-selected=true]{background:var(--line);font-weight:600}
.rl{list-style:none;margin:0;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.rl li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;line-height:1.4}
.rl img{width:30px;height:32px;flex:none;object-fit:contain}
.fl svg{display:block;width:100%;height:auto}
.se{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;color:rgba(255,255,255,.85);font-size:14px}
.dbg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub);background:var(--line);border-radius:12px;padding:6px 8px;margin-bottom:10px}
.dbg button{padding:5px 9px;font-size:12px;border-radius:8px}
#app.obx{max-width:488px;padding:0}
.ob2{position:relative;height:100vh;height:100dvh;padding:0 min(50px,10.25vw);color:#26302a;font-weight:700}
.ob2 .body{padding-top:84px}
.ob2 .body.t{padding-top:108px}
.ob2 .hero{display:block;width:min(380px,100%);height:auto;margin:0 auto}
.ob2 .big{font-size:47px;font-weight:800;line-height:1.2;margin:65px 0 0;text-align:center;letter-spacing:-0.02em}
.ob2 .b{font-size:18.6px;font-weight:700;line-height:40px;margin:0}
.ob2 .c .b{text-align:center;margin-top:27px}
.ob2 .q,.ob2 .mid{font-size:28.6px;font-weight:800;line-height:1.3;margin:0}
.ob2 .mid{text-align:center}
.ob2 .g{font-size:16.8px;font-weight:700;color:#7d877f;margin:2px 0 0;line-height:22px}
.ob2 .rules{list-style:none;padding:0;margin:53px 0 0 -15px;display:flex;flex-direction:column;gap:30px}
.ob2 .rules li{display:flex;align-items:center;gap:10px;font-size:18.5px;font-weight:700;line-height:30px}
.ob2 .sp{width:54px;height:58px;flex:none;object-fit:contain}
.ob2 .dd{position:relative;margin-top:42px}
.ob2 .ddb{display:block;width:100%;height:56px;padding:0 24px;text-align:left;font-size:18px;font-weight:500;border-radius:8px;background:#fff;color:#26302a;border:1px solid #e3e7df;background-image:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOCAxOCI+PHBhdGggZD0iTTEuNSA1TDkgMTIuNUwxNi41IDUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI2MzAyYSIgc3Ryb2tlLXdpZHRoPSIyLjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg==);background-repeat:no-repeat;background-position:right 24px center;background-size:18px 18px}
.ob2 .ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px 0;list-style:none;background:#fff;border:1px solid #e3e7df;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:5}
.ob2 .ddl[hidden]{display:none}
.ob2 .ddl li{padding:14px 24px;font-size:18px;font-weight:500;cursor:pointer}
.ob2 .ddl li[aria-selected=true]{background:#eef3ec;font-weight:700}
.ob2 .btns{position:absolute;left:0;right:0;bottom:130px;display:flex;gap:17px;justify-content:center}
.ob2 button{width:70px;height:40px;padding:0;background:#2a9d6a;color:#fff;border-radius:8px;font-size:18px;font-weight:800}
.ob2 button.soft{background:#dfe5dc;color:#26302a}
.ob2 .pg{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#7d877f;font-size:14px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEBUG=false; /* 테스트 모드: 완성 후 false로 바꾸면 원래 규칙으로 돌아가요 */
const LIM=DEBUG?99:3;
const COLORS=["#f28b82","#f6b26b","#f2c94c","#b39ddb","#7fb5e8","#f2a1c7"];
const CUT=[[0,"자정 (00:00)"],[3,"새벽 3시"],[4,"새벽 4시"],[5,"새벽 5시"]];
let S={habits:[],flowers:[],cutoff:0,onboarded:false,colorIdx:0},tab="home",ob=0,modalOpen=false;
try{const r=JSON.parse(localStorage.getItem("jaksim3")||"null");if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem("jaksim3",JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date(Date.now()-S.cutoff*36e5+(DEBUG?(S.dayOffset||0)*864e5:0));return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const diff=(a,b)=>Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/864e5);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const act=()=>S.habits.filter(h=>h.status==="active");
const done=()=>S.habits.filter(h=>h.status==="done");

const eul=s=>{const c=s.trim().slice(-1).charCodeAt(0);return c>=44032&&c<=55203?((c-44032)%28?"을":"를"):"을(를)"};
const CAP=100;
const DROP='<svg class="dr" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1C8 1 2 8.5 2 12.5a6 6 0 0 0 12 0C14 8.5 8 1 8 1Z" fill="#a8e0ff"/></svg>';
function plant(c,d,soil=true){
  const L="#6fb383",L2="#8fc27a",St="#3f7d52";
  const lf=(x,y,r,rot,col)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.5}" fill="${col}" transform="rotate(${rot} ${x} ${y})"/>`;
  let b="";
  if(d<=0)b='<path d="M30 51C35 56 36 61 30 64C24 61 25 56 30 51Z" fill="#7a5230"/><path d="M28.4 56C30.6 58 30.6 60.6 29 62" stroke="#b8946a" stroke-width="1.2" fill="none" stroke-linecap="round"/>';
  else if(d===1)b=`<path d="M30 63V44" stroke="${St}" stroke-width="2.6" stroke-linecap="round"/>`+lf(23,42,8,28,L)+lf(37,40,9,-28,L2);
  else if(d===2)b=`<path d="M30 63V33" stroke="${St}" stroke-width="2.6" stroke-linecap="round"/>`+lf(23,51,7,28,L)+lf(37,49,7.5,-28,L2)+`<path d="M24.5 31Q30 40 35.5 31Z" fill="${St}"/><ellipse cx="30" cy="26" rx="5.4" ry="8" fill="${c}"/><path d="M30 19Q32.5 26 30 33" stroke="rgba(255,255,255,.45)" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
  else{b=`<path d="M30 63V30" stroke="${St}" stroke-width="2.6" stroke-linecap="round"/>`+lf(22,52,8.5,28,L)+lf(38,47,9,-28,L2);
    for(let i=0;i<6;i++)b+=`<ellipse cx="30" cy="17.5" rx="4.8" ry="8" fill="${c}" transform="rotate(${i*60} 30 26)"/>`;b+='<circle cx="30" cy="26" r="4.6" fill="#f9e27a"/>'}
  const sl=soil?'<ellipse cx="30" cy="64" rx="14" ry="4" fill="var(--soil)"/>':"";
  return `<svg viewBox="0 0 60 ${soil?70:64}" aria-hidden="true">${sl}${b}</svg>`;
}
function gardenFull(){
  modal("꽃밭이 가득 찼어요 🌼",`꽃이 ${CAP}송이가 되었어요! 확인을 누르면 꽃밭이 그대로 남고, 다음 꽃이 피는 순간 새 꽃밭이 1송이부터 시작돼요.`,[["확인",null],["바로 리셋",()=>{S.flowers=[];save()},"soft"]]);
}
function pickPos(ex){
  let best=null,bd=-1;
  for(let i=0;i<60;i++){
    const x=6+Math.random()*88,y=11+Math.random()*86;
    const d=ex.length?Math.min(...ex.map(f=>Math.hypot(f.x-x,(f.y-y)*.9))):99;
    if(d>bd){bd=d;best={x:+x.toFixed(1),y:+y.toFixed(1)}}
  }
  return best;
}
function addFlower(color,date){
  if(S.flowers.length>=CAP)S.flowers=[];
  S.flowers.push(Object.assign({color,date},pickPos(S.flowers)));
}
if(!S.v2){const a=[];S.flowers.forEach(f=>{Object.assign(f,pickPos(a));a.push(f)});S.v2=1;save()}

function modal(t,x,btns){
  modalOpen=true;
  const o=document.createElement("div");o.className="ov";o.id="ov";
  o.innerHTML=`<div class="md" role="dialog"><h3>${t}</h3><p>${x}</p><div class="bt"></div></div>`;
  btns.forEach(b=>{const e=document.createElement("button");e.textContent=b[0];if(b[2])e.className=b[2];
    e.onclick=()=>{o.remove();modalOpen=false;if(b[1])b[1]();render()};o.querySelector(".bt").appendChild(e)});
  document.body.appendChild(o);
}
const closeBtn=["닫기",null,"soft"];

function sweep(){
  const t=today();
  S.habits=S.habits.filter(h=>!(h.status==="done"&&diff(t,h.doneDay)>=7));
  save();
  if(modalOpen)return;
  const m=act().find(h=>h.day>0&&h.lastCheck&&diff(t,h.lastCheck)>=2);
  act().forEach(x=>{if(x.day===0&&x.since===undefined)x.since=t});
  if(!m){
    const u=act().find(x=>x.day===0&&x.since&&(diff(t,x.since)>=7||(diff(t,x.since)>=1&&x.askedOn!==t)));
    if(u){
      const n=diff(t,u.since),rm=()=>{S.habits=S.habits.filter(x=>x!==u);save()};
      if(n>=7)modal("일과가 삭제돼요",`‘${esc(u.name)}’${eul(u.name)} 시작하지 않고 ${n}일이 지나서 삭제돼요.`,[["확인",rm]]);
      else modal("아직 시작하지 않았어요",`‘${esc(u.name)}’${eul(u.name)} 등록하고 ${n}일이 지났어요. 그대로 둘까요, 삭제할까요?`,[
        ["그대로 두기",()=>{u.askedOn=t;save()}],["삭제",rm,"soft"]]);
    }
    return;
  }
  modal("하루를 건너뛰었어요",`‘${esc(m.name)}’의 일수가 0일로 돌아갔어요. 내용을 그대로 두고 다시 시작할까요?`,[
    ["내용 유지하고 다시 시작",()=>{m.day=0;m.cycle=1;m.lastCheck=null;m.since=today();save()}],
    ["삭제",()=>{S.habits=S.habits.filter(h=>h!==m);save()},"soft"]]);
}

function addHabit(){
  const i=$("#nm");const v=i.value.trim();if(!v)return;
  if(act().length>=LIM)return;
  S.habits.push({id:Date.now(),name:v,color:COLORS[S.colorIdx%COLORS.length],status:"active",day:0,cycle:1,lastCheck:null,doneDay:null,since:today()});
  S.colorIdx++;save();render();
}

function check(id,el){
  const h=S.habits.find(x=>x.id===id);const t=today();
  if(!h||(!DEBUG&&h.lastCheck===t))return;
  h.day++;h.lastCheck=t;h.grew=true;
  const d=el.closest(".card");const dr=document.createElement("div");dr.className="drops";
  dr.innerHTML=[0,1,2,3,4].map(i=>`<i style="left:${8+i*11}px;animation-delay:${i*.1}s"></i>`).join("");d.appendChild(dr);
  el.disabled=true;
  setTimeout(()=>{
    if(h.day>=3){h.status="done";h.doneDay=t;addFlower(h.color,t);save();render();
      modal("3일 완료! 🌸",`‘${esc(h.name)}’ 꽃이 활짝 피었어요. 한 번 더 이어갈까요?`,[
        ["연장하기",()=>{extend(h);if(S.flowers.length>=CAP)gardenFull()}],["완료로 두기",()=>{if(S.flowers.length>=CAP)gardenFull()},"soft"]])}
    else{save();render()}
  },950);
  save();
}

function extend(h){
  if(act().length>=LIM){modal("진행 중이 가득 찼어요","진행 중인 일과는 최대 3개예요. 하나를 완료하거나 삭제한 뒤 다시 시도해 주세요.",[closeBtn]);return}
  const t=today();
  h.cycle=(h.status==="done"?h.cycle:1)+1;h.status="active";h.day=0;h.lastCheck=h.doneDay===t?t:null;h.since=t;h.doneDay=null;save();
}
function restart(h){
  if(act().length>=LIM){modal("진행 중이 가득 찼어요","진행 중인 일과는 최대 3개예요. 하나를 완료하거나 삭제한 뒤 다시 시도해 주세요.",[closeBtn]);return}
  h.status="active";h.day=0;h.cycle=1;h.lastCheck=null;h.since=today();h.doneDay=null;save();
}
function doneTap(id){
  const h=S.habits.find(x=>x.id===id);const age=diff(today(),h.doneDay);
  if(age<=2)modal("한 번 더 해볼까요?",`‘${esc(h.name)}’${eul(h.name)} ${h.cycle+1}번째 3일로 이어가요.`,[["연장하기",()=>extend(h)],closeBtn]);
  else modal("새로 시작할까요?",`연장 기간이 지나서 1번째 3일부터 다시 시작해요. 꽃밭의 꽃은 그대로예요.`,[["새로 시작",()=>restart(h)],closeBtn]);
}
function del(id){
  const h=S.habits.find(x=>x.id===id);
  modal("삭제할까요?",`‘${esc(h.name)}’${eul(h.name)} 삭제해요. 꽃밭의 꽃은 그대로 남아요.`,[["삭제",()=>{S.habits=S.habits.filter(x=>x.id!==id);save()}],closeBtn]);
}

function home(){
  const a=act(),d=done(),t=today();
  let h=`<div class="top"><div><h1>작심삼일</h1><p class="sub">딱 3일만 해봐요.</p></div><button class="gear" data-tab="set" aria-label="설정"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div><h2>진행 중 ${a.length}${DEBUG?"":"/3"}</h2>`;
  if(!a.length)h+='<p class="empty">아직 진행 중인 일과가 없어요. 아래에 하나 적어보세요.</p>';
  a.forEach(x=>{
    const ok=!DEBUG&&x.lastCheck===t;
    h+=`<div class="card" style="--c:${x.color}"><div style="width:64px;flex:none" class="${x.grew?"grow":""}">${plant(x.color,x.day)}</div>
    <div class="info"><div class="name">${esc(x.name)}</div><div class="meta">${x.cycle}번째 3일 · ${x.day}/3일</div>
    <div class="dots">${[1,2,3].map(n=>`<i class="${x.day>=n?"on":""}"></i>`).join("")}</div>
    <div class="row" style="margin-bottom:0"><button data-ck="${x.id}" ${ok?"disabled":""}>${ok?"✓ 완료됨":DROP+" 오늘 완료"}</button><button class="ghost" data-del="${x.id}">삭제</button></div></div></div>`;
    x.grew=false;
  });
  if(a.length<LIM)h+=`<div class="add"><input id="nm" maxlength="24" placeholder="예: 책 10쪽 읽기" aria-label="일과 이름"><button id="addb">추가</button></div>`;
  else h+='<p class="meta">진행 중 일과가 가득 찼어요.</p>';
  h+=`<h2>완료 ${d.length}</h2>`;
  if(!d.length)h+='<p class="empty">3일을 채우면 여기로 옮겨져요. 완료 후 7일이 지나면 자동으로 정리돼요.</p>';
  d.forEach(x=>{
    const age=diff(t,x.doneDay);
    h+=`<div class="card" style="--c:${x.color}"><div style="width:44px;flex:none">${plant(x.color,3)}</div>
    <div class="info" data-dt="${x.id}" style="cursor:pointer"><div class="name">${esc(x.name)}</div>
    <div class="meta">${x.cycle}번째 3일 완료 · ${age===0?"오늘":age+"일 전"}</div></div>
    <button class="${age<=2?"":"soft"}" data-dt="${x.id}">${age<=2?"연장 가능":"새로 시작"}</button><button class="ghost" data-del="${x.id}">삭제</button></div>`;
  });
  return h;
}
function garden(){
  const n=S.flowers.length;
  let h=`<div class="top"><div><h1>나의 꽃밭</h1><p class="sub">${n}/${CAP}송이 · 가득 차면 새 꽃밭이 시작돼요.</p></div><button class="ghost" id="rg">꽃밭 리셋하기</button></div><div class="soil">`;
  if(!n)h+='<p class="se">3일을 채우면 첫 꽃이 피어요.</p>';
  h+=[...S.flowers].sort((a,b)=>a.y-b.y).map(f=>`<div class="fl" style="left:${f.x}%;top:${f.y}%">${plant(f.color,3,false)}</div>`).join("");
  return h+"</div>";
}
function settings(){
  const cur=CUT.find(c=>c[0]===S.cutoff)[1];
  const R=["3일을 ‘연속으로’ 채워요","하루를 건너뛰면 0일부터 다시 시작해요","완료 후 이틀 내에 3일 도전을 연장할 수 있어요"];
  return `<h1>설정</h1>
  <h2>하루 마감 시간 설정</h2><p class="sub">하루가 바뀌는 시각을 정해요. 변경하면 바로 적용돼요.</p>
  <div class="row"><div class="dd dds"><input type="hidden" id="cut" value="${S.cutoff}"><button type="button" class="ddb" id="ddb" aria-haspopup="listbox" aria-expanded="false"><span class="lb">${cur}</span><svg class="ch" viewBox="0 0 18 18" aria-hidden="true"><path d="M1.5 5L9 12.5L16.5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ul class="ddl" role="listbox" hidden>${CUT.map(c=>`<li role="option" data-v="${c[0]}" aria-selected="${S.cutoff===c[0]}">${c[1]}</li>`).join("")}</ul></div></div>
  <h2>앱 규칙</h2><p class="sub">평생 하자고 다짐하는 대신, 딱 3일만 해봐요.</p>
  <ul class="rl" style="margin-top:10px">${R.map(t=>`<li><img src="${IMG_SP}" alt=""><span>${t}</span></li>`).join("")}</ul>
  <h2>데이터</h2><button class="soft" id="reset">모든 데이터 지우기</button>`;
}

function onboard(){
  const sp=`<img class="sp" src="${IMG_SP}" alt="">`;
  const s=[
   `<div class="body c"><img class="hero" src="${IMG_HERO}" alt="씨앗이 자라 해바라기가 되는 그림"><h1 class="big">작심삼일</h1><p class="b">평생의 다짐 대신, 딱 3일<br>3일을 여러 번 쌓으면 습관이 돼요</p></div>`,
   `<div class="body t"><h1 class="mid">규칙은 세 가지</h1><ul class="rules"><li>${sp}<span>3일을 ‘연속으로’ 채워요</span></li><li>${sp}<span>하루를 건너뛰면 0일부터 다시 시작해요</span></li><li>${sp}<span>완료 후 이틀 내에 3일 도전을 연장할 수 있어요</span></li></ul></div>`,
   `<div class="body t"><h1 class="q">하루의 마감은 몇 시로 할까요?</h1><p class="b" style="margin-top:23px">늦게 자는 편이라면 새벽까지를 하루로 세요</p><p class="g">(설정에서 언제든 바꿀 수 있어요)</p><div class="dd"><input type="hidden" id="cut" value="${S.cutoff}"><button type="button" class="ddb" id="ddb" aria-haspopup="listbox" aria-expanded="false">${CUT.find(c=>c[0]===S.cutoff)[1]}</button><ul class="ddl" role="listbox" hidden>${CUT.map(c=>`<li role="option" data-v="${c[0]}" aria-selected="${S.cutoff===c[0]}">${c[1]}</li>`).join("")}</ul></div></div>`];
  return `<div class="ob2">${s[ob]}<div class="btns">${ob>0?'<button class="soft" id="pv">이전</button>':''}<button id="nx">${ob<2?"다음":"시작"}</button></div><div class="pg">${ob+1}/3</div></div>`;
}
function initDd(){
  const b=$("#ddb");if(!b)return;
  const l=$(".ddl"),inp=$("#cut");
  b.onclick=()=>{const o=l.hidden;l.hidden=!o;b.setAttribute("aria-expanded",String(o))};
  l.querySelectorAll("li").forEach(li=>li.onclick=()=>{
    const v=+li.dataset.v;inp.value=v;S.cutoff=v;save();
    (b.querySelector(".lb")||b).textContent=li.textContent;
    l.querySelectorAll("li").forEach(x=>x.setAttribute("aria-selected",String(x===li)));
    l.hidden=true;b.setAttribute("aria-expanded","false");
  });
}
document.addEventListener("click",e=>{const l=document.querySelector(".ddl");if(l&&!e.target.closest(".dd")){l.hidden=true}});

function dbg(){
  if(!DEBUG)return "";
  return `<div class="dbg">🛠 테스트 · 기준일 ${today()}<button data-dbg="ob">온보딩 보기</button><button data-dbg="day">하루 넘기기</button><button data-dbg="fl">꽃 +10</button></div>`;
}
function render(){
  const app=$("#app");app.className=S.onboarded?"":"obx";
  if(!S.onboarded){document.documentElement.setAttribute("data-theme","light");app.innerHTML=onboard();initDd();
    const pv=$("#pv");if(pv)pv.onclick=()=>{ob--;render()};
    $("#nx").onclick=()=>{if(ob<2){ob++;render()}else{S.cutoff=+$("#cut").value;S.onboarded=true;save();render()}};return}
  document.documentElement.removeAttribute("data-theme");
  sweep();
  const body=tab==="home"?home():tab==="garden"?garden():settings();
  app.innerHTML=dbg()+body+`<nav><div>${[["home","나의 일과"],["garden","나의 꽃밭"]].map(t=>`<button class="${tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div></nav>`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  app.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>check(+b.dataset.ck,b));
  app.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>doneTap(+b.dataset.dt));
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(+b.dataset.del));
  app.querySelectorAll("[data-dbg]").forEach(b=>b.onclick=()=>{const k=b.dataset.dbg;
    if(k==="ob"){S.onboarded=false;ob=0}
    else if(k==="day"){S.dayOffset=(S.dayOffset||0)+1}
    else if(k==="fl"){for(let i=0;i<10;i++){addFlower(COLORS[Math.floor(Math.random()*COLORS.length)],today());if(S.flowers.length>=CAP){setTimeout(gardenFull,0);break}}}
    save();render()});
  const ab=$("#addb");if(ab){ab.onclick=addHabit;$("#nm").onkeydown=e=>{if(e.key==="Enter")addHabit()}}
  const c=$("#cut");if(c&&tab==="set")c.onchange=()=>{S.cutoff=+c.value;save();render()};
  initDd();
  const rg=$("#rg");if(rg)rg.onclick=()=>modal("꽃밭을 리셋할까요?","핀 꽃이 모두 사라지고 되돌릴 수 없어요.",[["리셋",()=>{S.flowers=[];save()}],closeBtn]);
  const r=$("#reset");if(r)r.onclick=()=>modal("모든 데이터를 지울까요?","일과, 꽃밭, 설정이 모두 사라지고 온보딩 화면부터 다시 시작해요. 되돌릴 수 없어요.",[["지우기",()=>{S.habits=[];S.flowers=[];S.colorIdx=0;S.cutoff=0;S.dayOffset=0;S.onboarded=false;ob=0;tab="home";save()}],closeBtn]);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.onboarded)render()});
render();
</script>
</body>
</html>
